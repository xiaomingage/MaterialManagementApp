<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>施工进度地图</title>
    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #f3f4f6;
            font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
            overflow: hidden;
        }

        /* 常显气泡：白底 + 左侧状态色边 + 底部小三角指向坐标点 */
        .bubble {
            position: relative;
            min-width: 140px;
            max-width: 230px;
            padding: 8px 12px 9px;
            background: #ffffff;
            border: 1px solid rgba(15, 23, 42, .10);
            border-left: 3px solid var(--status, #10B981);
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, .22);
            font-size: 12px;
            line-height: 1.45;
            color: #0f172a;
            white-space: nowrap;
            user-select: none;
            cursor: pointer;
        }

        /* 复工角标：已完工工点再次扫到照片后，气泡右上角提示 */
        .bubble-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 0 4px;
            border-radius: 3px;
            background: #FEF3C7;
            color: #B45309;
            font-size: 10px;
            font-weight: 600;
            vertical-align: 1px;
        }

        /* 固定参照点（项目部 / 仓库）：独立 Marker，不复用工点气泡样式，不参与状态色 */
        .fixed-marker {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            pointer-events: none;
        }

        .fixed-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, .6), 0 4px 10px rgba(15, 23, 42, .28);
        }

        .fixed-label {
            padding: 1px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, .94);
            border: 1px solid rgba(15, 23, 42, .08);
            box-shadow: 0 2px 6px rgba(15, 23, 42, .18);
            font-size: 11px;
            color: #0f172a;
            white-space: nowrap;
        }

        .bubble-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bubble-progress {
            color: #334155;
        }

        .bubble-status {
            margin-top: 4px;
            font-weight: 600;
            color: var(--status, #10B981);
        }

        .bubble-tail {
            position: absolute;
            left: 50%;
            bottom: -7px;
            width: 12px;
            height: 12px;
            margin-left: -6px;
            background: #ffffff;
            border-right: 1px solid rgba(15, 23, 42, .10);
            border-bottom: 1px solid rgba(15, 23, 42, .10);
            transform: rotate(45deg);
        }

        .hint {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 6px;
            background: rgba(15, 23, 42, .82);
            color: #f8fafc;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
            z-index: 1000;
            pointer-events: none;
        }

        .hint.hidden {
            display: none;
        }

        .legend {
            position: absolute;
            left: 12px;
            bottom: 12px;
            z-index: 1000;
            display: flex;
            gap: 14px;
            padding: 6px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, .92);
            box-shadow: 0 2px 8px rgba(15, 23, 42, .18);
            font-size: 12px;
            color: #334155;
            pointer-events: none;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="hint" class="hint hidden"></div>
    <div class="legend">
        <span class="legend-item"><i class="legend-dot" style="background:#10B981"></i>作业中</span>
        <span class="legend-item"><i class="legend-dot" style="background:#F59E0B"></i>停滞 1–2 天</span>
        <span class="legend-item"><i class="legend-dot" style="background:#EF4444"></i>中断 3 天以上</span>
        <span class="legend-item"><i class="legend-dot" style="background:#64748B"></i>已完工</span>
    </div>

    <script>
        (function () {
            'use strict';

            const DEFAULT_CENTER = [113.4, 23.1];
            const mapEl = document.getElementById('map');
            const hintEl = document.getElementById('hint');

            // 前端报错（含高德鉴权失败）转发给 C#，通过 WebMessageReceived 输出到 IDE 调试窗口
            function reportToHost(level, message) {
                try {
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage('map-console:' + level + ': ' + String(message));
                    }
                } catch (e) {
                    // 宿主通道不可用时忽略
                }
            }

            const nativeConsoleError = console.error.bind(console);
            console.error = function () {
                const text = Array.prototype.slice.call(arguments).join(' ');
                reportToHost('ERROR', text);
                nativeConsoleError.apply(null, arguments);
            };

            window.addEventListener('error', function (event) {
                reportToHost('ERROR', (event.message || '脚本错误') + ' @' + (event.filename || '') + ':' + (event.lineno || 0));
            });

            window.addEventListener('unhandledrejection', function (event) {
                const reason = event.reason && event.reason.message ? event.reason.message : event.reason;
                reportToHost('REJECTION', reason);
            });

            // 方式 A：配置只从 URL 查询参数注入，源码内不保存任何 Key 字面量。
            // C# 侧导航到 https://assets.local/map.html?key=xxx&jscode=yyy
            const query = new URLSearchParams(window.location.search);
            const apiKey = (query.get('key') || '').trim();
            const securityCode = (query.get('jscode') || '').trim();

            let map = null;
            let markers = [];
            let fixedMarkers = [];
            let amapReady = false;
            let scriptLoading = false;
            let siteData = [];
            let fixedPoints = [];
            let pendingCenter = null;

            // 向宿主发送纯文本消息（复工、地图加载计数、气泡点击都走这里）
            function postToHost(message) {
                try {
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage(message);
                    }
                } catch (e) {
                    // 宿主通道不可用时忽略
                }
            }

            // 与宿主建立双向通道：先告知已就绪，后续只接收工点数据（Key 不再走消息注入）
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.addEventListener('message', function (event) {
                    handleSiteData(event.data);
                });
                window.chrome.webview.postMessage('map-ready');
            }

            // 启动顺序固定：1) 设置安全密钥 → 2) 加载 maps 脚本 → 3) onload 后渲染 Marker
            if (!apiKey) {
                showHint('未配置高德地图 JS API Key：请到「设置 → 业务与参数 → 施工进度地图」填写 Key 与安全密钥并保存。');
            } else {
                bootstrapAmap();
            }

            function bootstrapAmap() {
                if (scriptLoading || amapReady) {
                    return;
                }

                scriptLoading = true;

                // 必须在加载 maps 脚本之前设置安全密钥，否则高德会报 INVALID_USER_SCODE
                if (securityCode) {
                    window._AMapSecurityConfig = { securityJsCode: securityCode };
                }

                const script = document.createElement('script');
                script.async = true;
                script.src = 'https://webapi.amap.com/maps?v=2.0&key=' + encodeURIComponent(apiKey);
                script.onload = function () {
                    scriptLoading = false;
                    amapReady = true;
                    initMap();
                    renderSites();

                    // 地图初始化并成功加载脚本后通知 C# 记一次「地图加载估算」（每月免费额度本地统计用）
                    postToHost('map-loaded');
                };
                script.onerror = function () {
                    scriptLoading = false;
                    showHint('高德地图脚本加载失败：请检查网络连接，或确认 JS API Key 是否有效。');
                };
                document.head.appendChild(script);
            }

            function handleSiteData(data) {
                if (!data || typeof data !== 'object' || data.type !== 'map-data') {
                    return;
                }

                siteData = Array.isArray(data.sites) ? data.sites : [];
                fixedPoints = Array.isArray(data.fixedPoints) ? data.fixedPoints : [];
                pendingCenter = normalizeCenter(data.center);

                if (amapReady) {
                    renderSites();
                }
            }

            // 中心点由 C# 统一计算：{ lng, lat, zoom } 或 null（null 时沿用默认中心/自动缩放）
            function normalizeCenter(center) {
                if (!center || typeof center !== 'object') {
                    return null;
                }

                const lng = Number(center.lng);
                const lat = Number(center.lat);
                if (!isFinite(lng) || !isFinite(lat) || (lng === 0 && lat === 0)) {
                    return null;
                }

                let zoom = Number(center.zoom);
                if (!isFinite(zoom) || zoom <= 0) {
                    zoom = 12;
                }

                return { lng: lng, lat: lat, zoom: zoom };
            }

            function initMap() {
                if (map) {
                    return;
                }

                const initialCenter = pendingCenter
                    ? [pendingCenter.lng, pendingCenter.lat]
                    : DEFAULT_CENTER;
                const initialZoom = pendingCenter ? pendingCenter.zoom : 12;

                map = new AMap.Map(mapEl, {
                    viewMode: '2D',
                    zoom: initialZoom,
                    center: initialCenter,
                    mapStyle: 'whitesmoke'
                });

                window.addEventListener('resize', function () {
                    if (map) {
                        map.resize();
                    }
                });
            }

            function renderSites() {
                if (!map) {
                    return;
                }

                clearMarkers();
                // 固定参照点独立渲染：即使没有工点也要显示，zIndex 高于工点气泡
                renderFixedPoints();

                if (siteData.length === 0) {
                    showHint('暂无带经纬度的工点记录：扫描到水印照片后会自动上图，未识别坐标的照片保留在「待定位池」。');
                    applyView();
                    return;
                }

                hideHint();

                siteData.forEach(function (site) {
                    const lng = Number(site.lng);
                    const lat = Number(site.lat);
                    if (!isFinite(lng) || !isFinite(lat) || (lng === 0 && lat === 0)) {
                        return;
                    }

                    markers.push(new AMap.Marker({
                        position: [lng, lat],
                        content: buildBubble(site),
                        anchor: 'bottom-center',
                        offset: new AMap.Pixel(0, -4),
                        zIndex: 200,
                        title: site.siteName || '工点'
                    }));
                });

                if (markers.length === 0) {
                    showHint('暂无有效坐标的工点记录。');
                    applyView();
                    return;
                }

                map.add(markers);
                applyView();
            }

            // 视野优先级：C# 下发的 center（项目部或工点均值）> 单点街道级 > 多点自适应
            function applyView() {
                if (!map) {
                    return;
                }

                if (pendingCenter) {
                    map.setZoomAndCenter(pendingCenter.zoom, [pendingCenter.lng, pendingCenter.lat]);
                    return;
                }

                if (markers.length === 1) {
                    map.setZoomAndCenter(15, markers[0].getPosition());
                } else if (markers.length > 1) {
                    map.setFitView(markers, false, [80, 80, 80, 80], 15);
                }
            }

            // 固定参照点：蓝（项目部）/ 橙（仓库）圆点 + 常显名称，不绑定 click、不参与状态色
            function renderFixedPoints() {
                clearFixedMarkers();

                fixedPoints.forEach(function (point) {
                    const lng = Number(point.lng);
                    const lat = Number(point.lat);
                    if (!isFinite(lng) || !isFinite(lat) || (lng === 0 && lat === 0)) {
                        return;
                    }

                    fixedMarkers.push(new AMap.Marker({
                        position: [lng, lat],
                        content: buildFixedMarker(point),
                        anchor: 'top-center',
                        offset: new AMap.Pixel(0, -7),
                        zIndex: 300,
                        title: point.name || '固定位置'
                    }));
                });

                if (fixedMarkers.length > 0) {
                    map.add(fixedMarkers);
                }
            }

            function clearFixedMarkers() {
                if (map && fixedMarkers.length > 0) {
                    map.remove(fixedMarkers);
                }
                fixedMarkers = [];
            }

            function buildFixedMarker(point) {
                const isDept = point.type === 'projectDept';
                const wrapper = document.createElement('div');
                wrapper.className = 'fixed-marker';

                const dot = document.createElement('div');
                dot.className = 'fixed-dot';
                dot.style.background = isDept ? '#2563EB' : '#F97316';

                const label = document.createElement('div');
                label.className = 'fixed-label';
                label.textContent = point.name || (isDept ? '项目部' : '仓库');

                wrapper.appendChild(dot);
                wrapper.appendChild(label);
                return wrapper;
            }

            function clearMarkers() {
                if (map && markers.length > 0) {
                    map.remove(markers);
                }
                markers = [];
            }

            function buildBubble(site) {
                const wrapper = document.createElement('div');
                wrapper.className = 'bubble';
                wrapper.style.setProperty('--status', site.colorHex || '#10B981');
                wrapper.title = '点击查看工点详情';

                const name = document.createElement('div');
                name.className = 'bubble-name';
                name.textContent = site.siteName || '未命名工点';

                // 复工角标：已完工工点再次扫到照片并自动恢复在建
                if (site.isRevived) {
                    const badge = document.createElement('span');
                    badge.className = 'bubble-badge';
                    badge.textContent = '复工';
                    name.appendChild(badge);
                }

                const progress = document.createElement('div');
                progress.className = 'bubble-progress';
                progress.textContent = site.progressText || '今日无作业记录';

                const status = document.createElement('div');
                status.className = 'bubble-status';
                status.textContent = site.statusText || '作业中';

                const tail = document.createElement('i');
                tail.className = 'bubble-tail';

                // 气泡 click 通知 C#：由 WinUI 侧弹出详情面板（高德 InfoWindow 放不下按钮与照片）
                wrapper.addEventListener('click', function (event) {
                    if (event && event.stopPropagation) {
                        event.stopPropagation();
                    }
                    postToHost('site-click:' + (site.siteName || ''));
                });

                wrapper.appendChild(name);
                wrapper.appendChild(progress);
                wrapper.appendChild(status);
                wrapper.appendChild(tail);
                return wrapper;
            }

            function showHint(text) {
                hintEl.textContent = text;
                hintEl.classList.remove('hidden');
            }

            function hideHint() {
                hintEl.classList.add('hidden');
            }
        })();
    </script>
</body>
</html>
